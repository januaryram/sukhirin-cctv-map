<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCTV Monitor สภ.สุคิริน - แผนที่ติดตามสถานะ</title>
  
  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PapaParse สำหรับแปลง CSV จาก Google Sheets -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- Prompt Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Prompt', sans-serif; }
    .pulse-online {
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: p-green 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    .pulse-offline {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: p-red 1.8s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes p-green { to { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); } }
    @keyframes p-red { to { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="h-16 bg-slate-900 border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400">
        <i data-lucide="shield-alert" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-base font-semibold leading-tight text-white flex items-center gap-2">
          ศูนย์ติดตามสถานะกล้องวงจรปิด สภ.สุคิริน
          <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Auto Sync
          </span>
        </h1>
        <p class="text-xs text-slate-400">ผบช.9 • ตรวจสอบสถานะ Online/Offline อัตโนมัติจาก Google Sheets</p>
      </div>
    </div>

    <!-- Quick Stats -->
    <div class="flex items-center gap-3 text-xs">
      <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
        <span>Online: <b id="stat-online" class="text-emerald-400">0</b></span>
      </div>
      <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
        <span>Offline: <b id="stat-offline" class="text-rose-400">0</b></span>
      </div>
      <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
        <span>รวมทั้งหมด: <b id="stat-total" class="text-white">0</b></span>
      </div>
      <button onclick="fetchSheetData()" class="p-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-white transition flex items-center gap-1 font-medium" title="โหลดข้อมูลใหม่">
        <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
      </button>
    </div>
  </header>

  <!-- Body -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar -->
    <aside class="w-96 bg-slate-900 border-r border-slate-800 flex flex-col">
      <div class="p-4 border-b border-slate-800 space-y-3">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
          <input type="text" id="search-box" placeholder="ค้นหาจุดติดตั้ง, UID, หรือป้อม..." oninput="filterData()"
                 class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-9 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>
        <!-- พื้นที่กรอง -->
        <div class="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs">
          <button onclick="setAreaFilter('ALL')" id="tab-all" class="py-1 rounded font-medium bg-blue-600 text-white">ทั้งหมด</button>
          <button onclick="setAreaFilter('ในเขตเทศบาล')" id="tab-in" class="py-1 rounded font-medium text-slate-400 hover:text-white">ในเขต</button>
          <button onclick="setAreaFilter('นอกเขตเทศบาล')" id="tab-out" class="py-1 rounded font-medium text-slate-400 hover:text-white">นอกเขต</button>
        </div>
      </div>

      <div id="cctv-list" class="flex-1 overflow-y-auto p-2 space-y-2">
        <!-- รายชื่อกล้องจะเรนเดอร์ตรงนี้ -->
      </div>
    </aside>

    <!-- Map Area -->
    <main class="flex-1 relative">
      <div id="map" class="w-full h-full bg-slate-950"></div>
    </main>
  </div>

  <script>
    // URL CSV จากแท็บ "ตารางรวม" ของสเปรดชีต
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/10_WES6R51gGtu7MqgyGI3CETt4zZX9RQzgzSr9xiiRs/export?format=csv&gid=0';

    let map;
    let markersLayer = L.layerGroup();
    let cctvData = [];
    let currentArea = 'ALL';

    function initMap() {
      // พิกัดกึ่งกลาง สภ.สุคิริน
      map = L.map('map', { zoomControl: false }).setView([5.9386, 101.7755], 14);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB & OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
      markersLayer.addTo(map);

      fetchSheetData();
      setInterval(fetchSheetData, 30000); // Auto-sync ทุกๆ 30 วินาที
    }

    async function fetchSheetData() {
      const refreshIcon = document.getElementById('refresh-icon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const res = await fetch(CSV_URL);
        const csvText = await res.text();
        
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            cctvData = results.data;
            renderMarkersAndList();
          }
        });
      } catch (err) {
        console.error('เกิดข้อผิดพลาดในการโหลดข้อมูล:', err);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('animate-spin');
      }
    }

    function renderMarkersAndList() {
      markersLayer.clearLayers();
      const listEl = document.getElementById('cctv-list');
      listEl.innerHTML = '';

      const query = document.getElementById('search-box').value.trim().toLowerCase();
      let countOnline = 0;
      let countOffline = 0;

      const filtered = cctvData.filter(item => {
        const name = item['ชื่อกล้อง / จุดติดตั้ง'] || '';
        const uid = item['UID กล้อง'] || '';
        const unit = item['ป้อมที่รับผิดชอบ'] || '';
        const area = item['เขตพื้นที่'] || '';

        const matchSearch = name.toLowerCase().includes(query) || uid.toLowerCase().includes(query) || unit.toLowerCase().includes(query);
        const matchArea = currentArea === 'ALL' || area === currentArea;
        return matchSearch && matchArea;
      });

      filtered.forEach(item => {
        const name = item['ชื่อกล้อง / จุดติดตั้ง'] || 'ไม่ระบุชื่อ';
        const uid = item['UID กล้อง'] || '-';
        const type = item['ประเภทกล้อง'] || 'CCTV';
        const status = (item['สถานะกล้อง'] || 'offline').trim();
        const isOnline = status.toLowerCase() === 'online';
        const lat = parseFloat(item['ละติจูด (Lat)']);
        const lng = parseFloat(item['ลองจิจูด (Lng)']);
        const unit = item['ป้อมที่รับผิดชอบ'] || '-';

        if (isOnline) countOnline++; else countOffline++;

        // วาดหมุดบนแผนที่เมื่อมีพิกัด Lat/Lng ถูกต้อง
        if (!isNaN(lat) && !isNaN(lng)) {
          const colorClass = isOnline ? 'bg-emerald-500 pulse-online' : 'bg-rose-500 pulse-offline';
          const icon = L.divIcon({
            className: 'cctv-pin',
            html: `<div class="w-5 h-5 rounded-full ${colorClass} border-2 border-slate-900 shadow flex items-center justify-center text-white"></div>`,
            iconSize: [20, 20],
            iconAnchor: [10, 10]
          });

          const marker = L.marker([lat, lng], { icon });
          marker.bindPopup(`
            <div style="font-family: 'Prompt', sans-serif; font-size: 13px;" class="p-1">
              <b class="text-sm">${name}</b><br>
              <span class="text-xs text-slate-400">UID: <code>${uid}</code></span><br>
              <div class="mt-1 flex items-center justify-between gap-4">
                <span>ประเภท: <b>${type}</b></span>
                <span class="font-bold ${isOnline ? 'text-emerald-500' : 'text-rose-500'}">${status}</span>
              </div>
              <div class="mt-2 text-xs text-slate-400">ผู้รับผิดชอบ: ${unit}</div>
              <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" 
                 class="block mt-2 text-center bg-blue-600 text-white rounded py-1 px-2 text-xs no-underline">
                 เปิดนำทางใน Google Maps
              </a>
            </div>
          `);
          markersLayer.addLayer(marker);

          // การ์ดใน Sidebar
          const card = document.createElement('div');
          card.className = 'p-3 bg-slate-950/70 hover:bg-slate-800 rounded-lg border border-slate-800 cursor-pointer transition';
          card.onclick = () => {
            map.flyTo([lat, lng], 17);
            marker.openPopup();
          };
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="text-xs font-semibold text-white">${name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${isOnline ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${status}</span>
            </div>
            <div class="text-[11px] text-slate-400 mt-1 font-mono">${uid}</div>
            <div class="text-[10px] text-slate-500 mt-0.5">${unit} • ${type} • ${item['เขตพื้นที่']}</div>
          `;
          listEl.appendChild(card);
        }
      });

      document.getElementById('stat-online').innerText = countOnline;
      document.getElementById('stat-offline').innerText = countOffline;
      document.getElementById('stat-total').innerText = filtered.length;
      lucide.createIcons();
    }

    function setAreaFilter(area) {
      currentArea = area;
      ['all', 'in', 'out'].forEach(k => {
        const btn = document.getElementById(`tab-${k}`);
        btn.className = "py-1 rounded font-medium text-slate-400 hover:text-white";
      });
      if (area === 'ALL') document.getElementById('tab-all').className = "py-1 rounded font-medium bg-blue-600 text-white";
      if (area === 'ในเขตเทศบาล') document.getElementById('tab-in').className = "py-1 rounded font-medium bg-blue-600 text-white";
      if (area === 'นอกเขตเทศบาล') document.getElementById('tab-out').className = "py-1 rounded font-medium bg-blue-600 text-white";
      renderMarkersAndList();
    }

    function filterData() {
      renderMarkersAndList();
    }

    window.onload = initMap;
  </script>
</body>
</html>
