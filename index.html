<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบติดตามกล้องวงจรปิด สภ.สุคิริน</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PapaParse สำหรับแปลง CSV จาก Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .marker-online {
      background-color: #22c55e;
      animation: pulse-green 2s infinite;
    }
    .marker-offline {
      background-color: #ef4444;
      animation: pulse-red 1.5s infinite;
    }
    .marker-onoff {
      background-color: #f59e0b;
    }
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #f8fafc !important;
      border-radius: 0.75rem !important;
      border: 1px solid #334155;
    }
    .leaflet-popup-tip {
      background: #0f172a !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-5 py-3 flex items-center justify-between shrink-0 z-20 shadow-md">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg border border-blue-500/30">
        <i data-lucide="cctv" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg text-white leading-tight">ระบบติดตามกล้องวงจรปิด สภ.สุคิริน</h1>
        <p class="text-xs text-slate-400">ฐานข้อมูล ผบช.9 (ซิงค์ตรงจาก Google Sheet)</p>
      </div>
    </div>

    <!-- สรุปสถิติ & ปุ่ม Refresh -->
    <div class="flex items-center gap-2 text-xs font-medium">
      <div class="hidden sm:flex bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg items-center gap-2">
        <span class="text-slate-400">ทั้งหมด:</span>
        <span id="stat-total" class="font-bold text-white">0</span>
      </div>
      <div class="bg-emerald-950/60 border border-emerald-700/50 text-emerald-300 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="hidden sm:inline">Online:</span>
        <span id="stat-online" class="font-bold">0</span>
      </div>
      <div class="bg-rose-950/60 border border-rose-700/50 text-rose-300 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span>
        <span class="hidden sm:inline">Offline:</span>
        <span id="stat-offline" class="font-bold">0</span>
      </div>
      <button onclick="fetchSheetData()" title="รีเฟรชข้อมูล" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">
        <i data-lucide="refresh-cw" class="w-4 h-4" id="refresh-icon"></i>
      </button>
    </div>
  </header>

  <!-- Content Layout -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside class="w-80 md:w-96 bg-slate-900/95 backdrop-blur border-r border-slate-800 flex flex-col shrink-0 z-10">
      <div class="p-3 border-b border-slate-800 space-y-2.5">
        <!-- ค้นหา -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="ค้นหาชื่อกล้อง, UID, ป้อม..." 
            class="w-full bg-slate-800 border border-slate-700 rounded-lg pl-9 pr-3 py-1.5 text-sm text-white focus:outline-none focus:border-blue-500"
          />
        </div>

        <!-- ตัวกรองสถานะ -->
        <div class="grid grid-cols-3 gap-1.5 p-1 bg-slate-800/80 border border-slate-700/50 rounded-lg text-xs text-center font-medium">
          <button onclick="setStatusFilter('ALL')" id="filter-all" class="py-1.5 rounded-md bg-blue-600 text-white font-semibold shadow transition">ทั้งหมด</button>
          <button onclick="setStatusFilter('Online')" id="filter-online" class="py-1.5 rounded-md text-slate-300 hover:text-white transition">Online</button>
          <button onclick="setStatusFilter('Offline')" id="filter-offline" class="py-1.5 rounded-md text-slate-300 hover:text-white transition">Offline</button>
        </div>

        <!-- ตัวกรองประเภทกล้อง -->
        <select id="type-filter" onchange="applyFilters()" class="w-full bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:outline-none">
          <option value="ALL">ทุกประเภท (4G, Wifi, ยุทธวิธี)</option>
          <option value="4G">เฉพาะกล้อง 4G</option>
          <option value="Wifi">เฉพาะกล้อง Wifi</option>
          <option value="ยุทธวิธี">เฉพาะกล้อง ยุทธวิธี</option>
        </select>
      </div>

      <!-- รายการกล้อง -->
      <div id="camera-list" class="flex-1 overflow-y-auto p-3 space-y-2">
        <div class="text-center py-10 text-slate-500 text-xs">กำลังโหลดข้อมูล...</div>
      </div>
    </aside>

    <!-- Map Container -->
    <main class="flex-1 relative h-full">
      <div id="map" class="w-full h-full"></div>
    </main>
  </div>

  <script>
    // URL CSV ที่เชื่อมตรงกับชีต "ตารางรวม" (gid=649862841)
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSMp9mKQv4IFkOiJWWhXPqyEQAEl5rCYym5-qN_-nz4vjoxyzoZhOxW9iqRP5GKxxMWCh12xlFiJgiH/pub?gid=649862841&single=true&output=csv";

    let rawData = [];
    let selectedStatusFilter = "ALL";
    let map;
    let markersLayer = L.layerGroup();

    // เริ่มต้นแผนที่ด้วย Google Maps + GeoJSON อ.สุคิริน
    function initMap() {
      map = L.map("map", { zoomControl: false }).setView([5.9385, 101.7755], 13);

      const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
      });

      const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
        attribution: '&copy; Google Maps'
      });

      googleStreets.addTo(map);

      // โหลดขอบเขตตำบล อ.สุคิริน (ถ้ามีไฟล์ใน repo)
      const boundaryLayer = L.geoJSON(null, {
        style: {
          color: '#2563eb',
          weight: 2,
          dashArray: '4, 4',
          fillColor: '#3b82f6',
          fillOpacity: 0.16
        },
        onEachFeature: function (feature, layer) {
          const p = feature.properties || {};
          const name = p.tam_th || p.name || p.NAME_TH || p.SUB_DIST_T || "ตำบลใน อ.สุคิริน";
          layer.bindTooltip(`<b>${name}</b>`, {
            sticky: true,
            direction: 'center',
            className: 'bg-slate-900 text-white px-2 py-1 rounded text-xs border border-slate-700 shadow-md font-sans'
          });
        }
      }).addTo(map);

      fetch('sukhirin-subdistricts.geojson')
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data) {
            boundaryLayer.addData(data);
            if (boundaryLayer.getBounds().isValid()) {
              map.fitBounds(boundaryLayer.getBounds(), { padding: [20, 20] });
            }
          }
        })
        .catch(() => {});

      const baseMaps = {
        "Google แผนที่ถนน": googleStreets,
        "Google ภาพดาวเทียม": googleHybrid
      };
      const overlays = {
        "ขอบเขต อ.สุคิริน": boundaryLayer
      };
      L.control.layers(baseMaps, overlays, { position: "topright" }).addTo(map);

      L.control.zoom({ position: "bottomright" }).addTo(map);
      markersLayer.addTo(map);
    }

    // สร้างไอคอนหมุด (Online เขียว / Offline แดง)
    function createCustomMarker(status) {
      const isOnline = (status || "").toLowerCase() === "online";
      const colorClass = isOnline ? "marker-online" : "marker-offline";

      return L.divIcon({
        className: "custom-pin",
        html: `<div class="w-3.5 h-3.5 rounded-full border-2 border-white shadow ${colorClass}"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });
    }

    // แสดงผลข้อมูลและหมุด
    function renderApp(items) {
      markersLayer.clearLayers();
      const listContainer = document.getElementById("camera-list");
      listContainer.innerHTML = "";

      const total = rawData.length;
      const online = rawData.filter(c => (c.status || "").toLowerCase() === "online").length;
      const offline = total - online;

      document.getElementById("stat-total").innerText = total;
      document.getElementById("stat-online").innerText = online;
      document.getElementById("stat-offline").innerText = offline;

      if (items.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">ไม่พบรายการกล้องที่ค้นหา</div>`;
        return;
      }

      items.forEach(cam => {
        const isOnline = (cam.status || '').toLowerCase() === 'online';
        
        // วาดหมุดบนแผนที่
        if (cam.lat && cam.lng && !isNaN(cam.lat) && !isNaN(cam.lng)) {
          const marker = L.marker([cam.lat, cam.lng], { icon: createCustomMarker(cam.status) });
          marker.bindPopup(`
            <div class="p-1 space-y-1 text-xs">
              <div class="font-bold text-white text-sm border-b border-slate-700 pb-1">${cam.name}</div>
              <div><b>สถานะ:</b> <span class="${(cam.status || '').toLowerCase() === 'online' ? 'text-emerald-400':'text-rose-400'} font-semibold">${cam.status}</span></div>
              <div><b>ประเภท:</b> ${cam.type}</div>
              <div><b>UID:</b> <span class="font-mono text-blue-300 text-[11px]">${cam.uid}</span></div>
              <div><b>ป้อมรับผิดชอบ:</b> ${cam.station}</div>
            </div>
          `);
          markersLayer.addLayer(marker);
          cam._marker = marker;
        }

        // การ์ดรายการในแถบด้านข้าง
        const card = document.createElement("div");
        card.className = "p-2.5 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 hover:border-slate-600 transition cursor-pointer";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-1">
            <span class="font-semibold text-xs text-slate-100">${cam.name}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold ${
              isOnline ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
            }">${isOnline ? 'Online' : 'Offline'}</span>
          </div>
          <div class="text-[11px] text-slate-400 font-mono mt-0.5">${cam.uid}</div>
          <div class="flex justify-between text-[10px] text-slate-400 mt-2 pt-1.5 border-t border-slate-700/40">
            <span>กล้อง ${cam.type}</span>
            <span>${cam.station}</span>
          </div>
        `;

        card.addEventListener("click", () => {
          if (cam.lat && cam.lng && !isNaN(cam.lat)) {
            map.flyTo([cam.lat, cam.lng], 16, { duration: 1 });
            if (cam._marker) setTimeout(() => cam._marker.openPopup(), 1000);
          }
        });

        listContainer.appendChild(card);
      });
      lucide.createIcons();
    }
    
    // ตัวกรองสถานะ (ทั้งหมด, Online, Offline)
    function setStatusFilter(status) {
      selectedStatusFilter = status;
      ['all', 'online', 'offline'].forEach(key => {
        const btn = document.getElementById(`filter-${key}`);
        if (key.toLowerCase() === status.toLowerCase() || (key === 'all' && status === 'ALL')) {
          btn.className = "py-1.5 rounded-md bg-blue-600 text-white font-semibold shadow transition";
        } else {
          btn.className = "py-1.5 rounded-md text-slate-300 hover:text-white transition";
        }
      });
      applyFilters();
    }

    // ประมวลผลตัวกรองและช่องค้นหา
    function applyFilters() {
      const q = document.getElementById("search-input").value.toLowerCase();
      const t = document.getElementById("type-filter").value;

      const filtered = rawData.filter(cam => {
        const isOnline = (cam.status || "").toLowerCase() === "online";
        const matchStatus = (selectedStatusFilter === "ALL") || 
          (selectedStatusFilter === "Online" && isOnline) ||
          (selectedStatusFilter === "Offline" && !isOnline);

        const matchType = (t === "ALL") || (cam.type === t);
        const matchSearch = (cam.name || "").toLowerCase().includes(q) || 
                            (cam.uid || "").toLowerCase().includes(q) || 
                            (cam.station || "").toLowerCase().includes(q);

        return matchStatus && matchType && matchSearch;
      });

      renderApp(filtered);
    }

    // ดึงข้อมูลสดจาก Google Sheet (Live Sync)
    function fetchSheetData() {
      const refreshIcon = document.getElementById("refresh-icon");
      if (refreshIcon) refreshIcon.classList.add("animate-spin");

      // ใส่ timestamp ป้องกันเบราว์เซอร์จำ cache เก่า
      const liveUrl = CSV_URL + "&t=" + Date.now();

      Papa.parse(liveUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            rawData = results.data
              .filter(row => row["ชื่อกล้อง / จุดติดตั้ง"] && row["ชื่อกล้อง / จุดติดตั้ง"].trim() !== "")
              .map((row, idx) => ({
                id: row["ลำดับ"] || idx + 1,
                station: row["ป้อมที่รับผิดชอบ"] || "-",
                name: row["ชื่อกล้อง / จุดติดตั้ง"],
                type: row["ประเภทกล้อง"] || "4G",
                uid: row["UID กล้อง"] || "-",
                lat: parseFloat(row["ละติจูด (Lat)"]),
                lng: parseFloat(row["ลองจิจูด (Lng)"]),
                status: (row["สถานะกล้อง"] || "Offline").trim()
              }));
          }
          if (refreshIcon) refreshIcon.classList.remove("animate-spin");
          applyFilters();
        },
        error: function(err) {
          console.error("เกิดข้อผิดพลาดในการดึงข้อมูล:", err);
          if (refreshIcon) refreshIcon.classList.remove("animate-spin");
        }
      });
    }

    document.getElementById("search-input").addEventListener("input", applyFilters);

    window.addEventListener("DOMContentLoaded", () => {
      initMap();
      fetchSheetData(); // ดึงข้อมูลทันทีเมื่อเปิดเว็บ

      // ซิงค์ข้อมูลใหม่อัตโนมัติทุกๆ 60 วินาที
      setInterval(fetchSheetData, 60000);
    });
  </script>
</body>
</html>
